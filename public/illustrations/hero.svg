<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" fill="none">
  <!--
    Poliscope — illustration du hero.
    Remplaçable : déposez votre propre fichier ici (même nom, même viewBox
    approximative) et le site l'utilisera sans modification de code.
  -->
  <g stroke="#0f1729" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <!-- sol -->
    <ellipse cx="205" cy="292" rx="150" ry="20" fill="#F5E7D2" stroke="none"/>

    <!-- feuillage gauche -->
    <g>
      <path d="M52 262V196" />
      <path d="M52 226c-14-4-22-16-22-30 14 0 24 8 26 22" fill="#CBDCC3"/>
      <path d="M52 240c14-6 21-19 20-34-14 1-24 10-25 24" fill="#D8E5D1"/>
      <path d="M52 208c-11-6-16-17-14-29 12 2 20 12 19 24" fill="#CBDCC3"/>
    </g>

    <!-- arbuste droit -->
    <g>
      <path d="M352 268v-30" />
      <ellipse cx="352" cy="222" rx="21" ry="18" fill="#D8E5D1"/>
      <path d="M338 216c5-6 12-9 20-8" stroke-width="1.6"/>
    </g>

    <!-- bâtiment -->
    <g>
      <!-- mât + drapeau -->
      <path d="M205 116V74"/>
      <path d="M205 76h30v18h-30z" fill="#EAF1FE"/>
      <path d="M205 76h10v18h-10z" fill="#1d6ff2" stroke="none"/>
      <path d="M225 76h10v18h-10z" fill="#DC2626" stroke="none"/>
      <path d="M205 76h30v18h-30z"/>

      <!-- fronton -->
      <path d="M132 164 205 116l73 48z" fill="#FFFFFF"/>
      <path d="M150 158h110" stroke-width="1.4"/>

      <!-- entablement -->
      <rect x="126" y="164" width="158" height="12" rx="2" fill="#FFFFFF"/>

      <!-- colonnes -->
      <g stroke-width="2">
        <path d="M144 176v66M172 176v66M200 176v66M228 176v66M256 176v66"/>
      </g>

      <!-- porte -->
      <path d="M198 242v-30a7 7 0 0 1 14 0v30" fill="#EFE9DB"/>

      <!-- soubassement + marches -->
      <rect x="126" y="242" width="158" height="10" rx="2" fill="#FFFFFF"/>
      <rect x="118" y="252" width="174" height="9" rx="2" fill="#FFFFFF"/>
      <rect x="110" y="261" width="190" height="9" rx="2" fill="#FFFFFF"/>
    </g>

    <!-- fontaine -->
    <g>
      <ellipse cx="205" cy="286" rx="34" ry="10" fill="#EAF1FE"/>
      <path d="M205 276v-12" stroke-width="1.8"/>
      <path d="M195 268c3-9 17-9 20 0" stroke-width="1.5"/>
      <path d="M188 284c6 3 28 3 34 0" stroke-width="1.2" stroke-opacity=".45"/>
    </g>

    <!-- vélo + cycliste -->
    <g transform="translate(24 236)">
      <circle cx="14" cy="42" r="13" fill="#FFFFFF"/>
      <circle cx="52" cy="42" r="13" fill="#FFFFFF"/>
      <path d="M14 42l14-22h14l10 22" />
      <path d="M28 20h16" />
      <path d="M33 42h10" stroke-width="1.5"/>
      <circle cx="40" cy="6" r="6" fill="#FFFFFF"/>
      <path d="M40 12v10l-8 6M40 22l8 6" />
    </g>

    <!-- bulle -->
    <g transform="translate(36 34)">
      <path d="M8 0h56a8 8 0 0 1 8 8v22a8 8 0 0 1-8 8H26l-14 12 2-12H8a8 8 0 0 1-8-8V8a8 8 0 0 1 8-8z" fill="#FFFFFF"/>
      <g fill="#9CA3AF" stroke="none">
        <circle cx="24" cy="19" r="3.2"/>
        <circle cx="36" cy="19" r="3.2"/>
        <circle cx="48" cy="19" r="3.2"/>
      </g>
    </g>
  </g>

  <!-- étincelles -->
  <g stroke="#F5C452" stroke-width="2.4" stroke-linecap="round">
    <path d="M300 96v8M306 90l-5 5M294 90l5 5"/>
    <path d="M120 100v6M125 96l-4 4M115 96l4 4"/>
  </g>
</svg>
